services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strcleaning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app} # dev only; production sets its own
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Scheduler worker: hourly iCal sync + recurring-series expansion.
  # Runs lib/scheduler.ts via scripts/scheduler.ts. Shares the app image.
  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "scheduler"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
